connections {
   ims {
      local_addrs  = ###LOCAL_IP###
      remote_addrs = ###EPDG_IP###

      # ###VIRT_IPv4s### vips = 0.0.0.0
      # ###VIRT_IPv6s### vips = ::

      local {
         auth = eap-aka
         id = 0###IMSI###@nai.epc.mnc0###MNC###.mcc###MCC###.3gppnetwork.org
      }

      remote {
         id = ims
      }

      children {
         ims {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Prefer secure over weak
            # ###ESP_SECURE_FIRST### esp_proposals = aes256-aes128-sha512-sha256-aesxcbc-noesn

            # Prefer weak over secure
            # ###ESP_WEAK_FIRST### esp_proposals = aes128-aes256-md5-sha1-aesxcbc-sha256-noesn

            # Prefer weak over secure, incl. insecure encryption suites
            # ###ESP_INSECURE### esp_proposals = null-3des-aes128-aes256-md5-sha1-aesxcbc-sha256-noesn

            # Placeholder for custom, user-provided ESP proposal
            ###CUSTOM_ESP_PROPOSAL###
         }

         ims-f11-null {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Try to use NULL encryption as the only offered cipher.
            # Assuming 'md5-sha1-sha256-noesn' as 'dont care'
            esp_proposals = null-md5-sha1-sha256-noesn
         }

         ims-f11-blowfish {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Try to use any blowfish encryption as the only offered cipher.
            # Assuming 'md5-sha1-sha256-noesn' as 'dont care'
            esp_proposals = blowfish128-blowfish192-blowfish256-md5-sha1-sha256-noesn
         }

         ims-f11-3des {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Try to use 3DES encryption as the only offered cipher.
            # Assuming 'md5-sha1-sha256-noesn' as 'dont care'
            esp_proposals = 3des-md5-sha1-sha256-noesn
         }

         ims-f11-hmac-md5 {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Try to use MD5 integrity protection as the only offered algorithm.
            # Assuming 'aes256-aes128' as 'dont care'
            esp_proposals = aes256-aes128-md5-md5_128-noesn
         }

         ims-f11-hmac-sha1 {
            # ###TS_IPv4### remote_ts = 0.0.0.0/0
            # ###TS_IPv6### remote_ts = ::/0
            updown = /usr/local/etc/ims.updown
            if_id_in = 23
            if_id_out = 23

            # Try to use SHA1 integrity protection as the only offered algorithm.
            # Assuming 'aes256-aes128' as 'dont care'
            esp_proposals = aes256-aes128-sha1-sha1_160-noesn
         }
      }
      version = 2

      # Standard as of 3GPP TS 33.210 v 16.4.0, but weakest suite is selected by strongSwan for testing.
      # ###3GPP_v16.4.0### proposals = aes128-aes256-prfsha256-prfsha384-sha1-sha256-modp1024-modp2048-modp4096-ecp256

      # Standard as of 3GPP TS 33.210 v 12.2.0, but weakest suite is selected by strongSwan for testing.
      # ###3GPP_v12.2.0### proposals = 3des-aes128-prfsha1-prfaesxcbc-sha1-aesxcbc-modp1024-modp2048

      # v12.2.0 with added insecure DH groups, prefer-weakest.
      # ###3GPP_v12.2.0_INSECURE_DH### proposals = 3des-aes128-prfsha1-prfaesxcbc-sha1-aesxcbc-modp768-modp1024-modp1536-modp2048-modp3072-modp4096-modp6144-modp8192

      # Placeholder for custom, user-provided IKE proposal
      ###CUSTOM_IKE_PROPOSAL###
   }
}
