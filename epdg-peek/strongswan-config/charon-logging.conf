# Adapted from https://osmocom.org/projects/foss-ims-client/wiki/VoWiFi_with_Asterisk

charon {
    filelog {
        charon {
            default = 1
            ike = 1
            append = no
            flush_line = yes
            ike_name = yes
            log_level = yes
            path = ###LOG_DIR###/###START_TS###_###MCC###_###MNC###_strongswan.log
            time_format = "%F %T %z"
        }
    }

    syslog {
    }
}
